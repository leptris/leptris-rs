[workspace]
members = ["descriptor"]

[package]
name = "leptris"
version = "1.6.0"
edition = "2021"
description = "Rust bindings for libleptris — fast XML 1.0 parsing, XPath 1.0, SAX"
license = "MIT"
readme = "README.md"
repository = "https://github.com/leptris/leptris"
homepage = "https://www.leptris.org"
links = "leptris"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
default = []
# #1900: compile the engine INTO the crate for wasm32-unknown-unknown
# (the shim provides the freestanding libc). Requires LEPTRIS_SRC_PATH
# pointing at an engine source tree (CI fetches the pinned tarball).
wasm = []

[build-dependencies]
cc = "1"

[dev-dependencies]
leptris-descriptor = { path = "descriptor", features = ["link", "std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
