# Release-plz configuration for leptris-rs
# (modeled on parsanol-rs). See: https://release-plz.dev/docs/config

[workspace]
# Detect all workspace members automatically.
git_release_enable = true
# crates.io publish is handled by release.yml's dedicated step with
# --no-verify: cargo publish's tarball verification links the crate's
# cdylib against the SYSTEM libleptris, which no clean CI runner has
# (the crate binds a C library; its tests run in ci.yml against a
# built engine).
publish = false
dependencies_update = true

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""
